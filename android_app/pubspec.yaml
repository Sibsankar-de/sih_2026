name: fineline_navigator
description: "Fine Line - AI-ML Based Intelligent Dead Reckoning System for Seamless Navigation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  sensors_plus: ^6.1.1
  fl_chart: ^0.70.2
  provider: ^6.1.2
  go_router: ^14.8.1
  shared_preferences: ^2.5.2
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/configs/
    - assets/datasets/
